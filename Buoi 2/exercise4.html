<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 4: FPT University</title>
    <style>
      .fpt-orange {
        background-color: #ea7724;
      }
      .fpt-text-orange {
        color: #ea7724;
      }
    </style>
  </head>
  <body>
    <!-- Header Section with Orange Background -->
    <header class="fpt-orange text-center py-4">
      <div class="container">
        <!-- White card with logo and university title -->
        <div class="bg-white p-3 rounded-2 shadow-sm d-inline-block text-center px-5 py-4 my-2">
          <img
            src="assets/images/fpt-logo.svg"
            alt="FPT Education Logo"
            style="height: 55px;"
            class="d-block mx-auto mb-2"
          />
          <h4 class="fw-bold fpt-text-orange m-0" style="letter-spacing: 0.5px;">
            FPT UNIVERSITY
          </h4>
        </div>

        <!-- Navigation Menu -->
        <div class="mt-3">
          <a href="#" class="text-white text-decoration-none mx-2 fw-medium">Home</a>
          <a href="#" class="text-white text-decoration-none mx-2 fw-medium">About</a>
          <a href="#" class="text-white text-decoration-none mx-2 fw-medium">Contact</a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5 text-center" style="max-width: 700px;">
      <!-- About Section -->
      <section class="mb-4">
        <h4 class="fw-bold mb-2">About</h4>
        <p class="text-muted">This is the about section of the website.</p>
      </section>

      <!-- Contact Section -->
      <section class="mb-4">
        <h4 class="fw-bold mb-2">Contact</h4>
        <p class="text-muted">
          For any inquiries, please contact us at <a href="mailto:example@example.com" class="text-primary text-decoration-none">example@example.com</a>.
        </p>
      </section>
    </main>

    <!-- Footer Section -->
    <footer class="fpt-orange text-center py-3">
      <div class="container">
        <p class="text-white-50 m-0 small">&copy; 2023 Website. All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript: jQuery, Popper.js, and Bootstrap JS -->
    <script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
