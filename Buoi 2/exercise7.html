<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 7: Demo about Cards Column</title>
  </head>
  <body>
    <div class="container">
      <h4>Cards Columns</h4>

      <div class="row g-4">
        <div class="col-md-4">
          <div class="card h-100 border border-primary">
            <img
              src="assets/images/car.jpg"
              class="card-img-top p-2"
              alt="Car"
            />
            <div class="card-body bg-primary text-white text-center py-2">
              <p class="card-text small mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 border border-warning">
            <img
              src="assets/images/car.jpg"
              class="card-img-top p-2"
              alt="Car"
            />
            <div class="card-body bg-warning text-dark text-center py-2">
              <p class="card-text small mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 border border-danger">
            <img
              src="assets/images/car.jpg"
              class="card-img-top p-2"
              alt="Car"
            />
            <div class="card-body bg-danger text-white text-center py-2">
              <p class="card-text small mb-0">
                Some text inside the first card
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript: Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
