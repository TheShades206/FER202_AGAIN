<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 7: Demo about Cards Column</title>
  </head>
  <body>
    <div class="container my-4">
      <h4 class="mb-3 text-secondary">Cards Columns</h4>

      <div class="row g-4">
        <!-- Card 1 (Blue) -->
        <div class="col-12 col-md-4">
          <div class="card h-100 border border-primary border-4 rounded-2 overflow-hidden">
            <img src="assets/images/car.jpg" class="card-img-top p-2" alt="Car" />
            <div class="card-body bg-primary text-white text-center py-2">
              <p class="card-text small mb-0">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <!-- Card 2 (Yellow) -->
        <div class="col-12 col-md-4">
          <div class="card h-100 border border-warning border-4 rounded-2 overflow-hidden">
            <img src="assets/images/car.jpg" class="card-img-top p-2" alt="Car" />
            <div class="card-body bg-warning text-dark text-center py-2">
              <p class="card-text small mb-0">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <!-- Card 3 (Red) -->
        <div class="col-12 col-md-4">
          <div class="card h-100 border border-danger border-4 rounded-2 overflow-hidden">
            <img src="assets/images/car.jpg" class="card-img-top p-2" alt="Car" />
            <div class="card-body bg-danger text-white text-center py-2">
              <p class="card-text small mb-0">Some text inside the first card</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript: Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
