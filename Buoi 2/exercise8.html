<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 8: Demo about Form Control</title>
  </head>
  <body>
    <div class="container my-4" style="max-width: 500px;">
      <div class="border rounded p-4 shadow-sm bg-white">
        <!-- Alert bar at top with close button -->
        <div class="alert alert-warning alert-dismissible fade show p-2 mb-3" role="alert">
          <button
            type="button"
            class="btn-close p-2"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>

        <!-- Title -->
        <h2 class="fw-normal mb-3">Form đặt vé máy bay</h2>

        <form>
          <!-- 1. Họ tên with input group (icon prepend + vnd append) -->
          <div class="mb-3">
            <label class="form-label small text-muted mb-1">Họ tên</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted">
                <i class="bi bi-person"></i>
              </span>
              <input
                type="text"
                class="form-control"
                placeholder="Họ tên"
              />
              <span class="input-group-text bg-light text-muted">vnd</span>
            </div>
            <div class="form-text text-muted small">
              Phải nhập 5 ký tự, in hoa...
            </div>
          </div>

          <!-- 2. Địa chỉ -->
          <div class="mb-3">
            <label class="form-label small text-muted mb-1">Địa chỉ</label>
            <input type="text" class="form-control" />
            <div class="form-text text-muted small">
              Phải nhập 5 ký tự, in hoa...
            </div>
          </div>

          <!-- 3. Đi từ & Đến (Row 2 columns) -->
          <div class="row mb-3">
            <div class="col-6">
              <label class="form-label small text-muted mb-1">Đi từ</label>
              <select class="form-select">
                <option selected>Hà nội</option>
                <option>Đà Nẵng</option>
                <option>TP. Hồ Chí Minh</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label small text-muted mb-1">Đến</label>
              <select class="form-select">
                <option selected>Hà nội</option>
                <option>Đà Nẵng</option>
                <option>TP. Hồ Chí Minh</option>
              </select>
            </div>
          </div>

          <!-- 4. Chọn chiều đi (Khứ hồi) -->
          <div class="mb-3">
            <label class="form-label small text-muted mb-1">
              Chọn chiều đi (Khứ hồi)
            </label>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="di"
                checked
              />
              <label class="form-check-label small text-muted" for="di">
                Đi
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="ve" />
              <label class="form-check-label small text-muted" for="ve">
                Về
              </label>
            </div>
          </div>

          <!-- 5. Submit Button -->
          <button type="submit" class="btn btn-primary w-100 py-2">
            Đặt vé
          </button>
        </form>
      </div>
    </div>

    <!-- JavaScript: Bootstrap JS -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
