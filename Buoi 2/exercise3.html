<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 3: Let's test the grid with Nav</title>
  </head>
  <body>
    <!-- Exercise 3 Content -->
    <div class="container my-4">
      <div class="p-4 bg-light mb-3 rounded-1">
        <h2 class="m-0">Let's test the grid!</h2>
      </div>

      <!-- Navigation links -->
      <ul class="nav mb-3">
        <li class="nav-item">
          <a class="nav-link active ps-0" aria-current="page" href="#">Active</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
      </ul>

      <!-- Grid rows -->
      <div class="row g-0">
        <div class="col-8 border border-secondary bg-secondary-subtle p-2">First col</div>
        <div class="col-4 border border-secondary bg-secondary-subtle p-2">Second col</div>
      </div>
      <div class="row g-0">
        <div class="col-4 border border-secondary bg-secondary-subtle p-2">col</div>
        <div class="col-4 border border-secondary bg-secondary-subtle p-2">col</div>
        <div class="col-4 border border-secondary bg-secondary-subtle p-2">col</div>
      </div>
      <div class="row g-0 mb-4">
        <div class="col-3 border border-secondary bg-secondary-subtle p-2">col</div>
        <div class="col-3 border border-secondary bg-secondary-subtle p-2">col</div>
        <div class="col-3 border border-secondary bg-secondary-subtle p-2">col</div>
        <div class="col-3 border border-secondary bg-secondary-subtle p-2">col</div>
      </div>

      <div class="p-2 text-center rounded-1" style="background-color: #d1c4d1;">
        <h3 class="fw-bold mb-0">Created by ABC!</h3>
      </div>
    </div>

    <!-- JavaScript: jQuery, Popper.js, and Bootstrap JS -->
    <script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
