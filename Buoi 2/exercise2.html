<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Exercise 2: My First Bootstrap Page</title>
  </head>
  <body>
    <!-- Exercise 2 Content -->
    <div class="container my-4">
      <div class="p-5 bg-light mb-5 rounded-1 text-center">
        <h1 class="display-6 fw-bold text-secondary">My First Bootstrap Page</h1>
      </div>

      <div class="row align-items-center justify-content-center text-center g-4">
        <div class="col-md-4">
          <img
            src="assets/images/html5.svg"
            alt="HTML5 Logo"
            class="img-fluid"
            style="max-width: 180px;"
          />
        </div>
        <div class="col-md-4">
          <img
            src="assets/images/css3.svg"
            alt="CSS3 Logo"
            class="img-fluid"
            style="max-width: 180px;"
          />
        </div>
        <div class="col-md-4">
          <img
            src="assets/images/bootstrap.svg"
            alt="Bootstrap Logo"
            class="img-fluid"
            style="max-width: 180px;"
          />
        </div>
      </div>
    </div>

    <!-- JavaScript: jQuery, Popper.js, and Bootstrap JS -->
    <script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
    <script src="node_modules/@popperjs/core/dist/umd/popper.min.js"></script>
    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
  </body>
</html>
